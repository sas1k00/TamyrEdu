# Проверки на каждый push и pull request: тесты в браузере и правила доступа базы.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    name: Тесты в браузере (движок, модель ученика, перевод, экраны)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Запустить
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tools/run_tests.js http://127.0.0.1:8765

  database:
    name: Правила доступа Supabase (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Все supabase/*.sql дважды + сценарии доступа против эталона
        run: sh tools/test_sql.sh
