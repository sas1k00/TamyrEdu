<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamyr Academy — тесты</title>
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <main>
    <section class="card">
      <h1>Тесты: контент, генераторы, модель ученика</h1>
      <p class="muted" id="summary"></p>
      <p class="small">Язык контента: <a href="?lang=ru">русский</a> · <a href="?lang=kk">қазақша</a></p>
      <ul class="tests" id="tests"></ul>
    </section>
  </main>
  <script src="js/data.js?v=16"></script>
  <script src="js/data-ent.js?v=16"></script>
  <script>window.Tamyr.LEARNER_KEY = 'tamyr.academy.test';</script>
  <script src="js/i18n.js?v=16"></script>
  <script src="js/engine.js?v=16"></script>
  <script src="js/content.js?v=16"></script>
  <script src="js/content-ent.js?v=16"></script>
  <script src="js/kk-ent.js?v=16"></script>
  <script src="js/kk.js?v=16"></script>
  <script src="js/learner.js?v=16"></script>
  <script src="js/config.js?v=16"></script>
  <script>window.Tamyr.CONFIG = { supabaseUrl: '', supabaseKey: '' }; // тесты всегда идут без облака</script>
  <script src="js/account.js?v=16"></script>
  <script>
    const T = window.Tamyr, L = T.learner;
    const out = document.getElementById('tests');
    const results = [];
    function test(name, fn) {
      let ok = false, err = '';
      try { fn(); ok = true; } catch (e) { err = e.message; }
      results.push({ name, ok, err });
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}${err ? ' — ' + err : ''}</li>`);
    }
    function assert(c, m) { if (!c) throw new Error(m || 'assertion failed'); }
    function eq(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || '') + ` ожидалось ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`); }
    const norm = s => s.toLowerCase().replace(/\s+/g, ' ');

    /* ---------- Контент ---------- */
    test('У каждой темы есть урок минимум из 3 шагов и вывод', () => T.TOPICS.forEach(t => {
      const l = T.LESSONS[t.id];
      assert(l && l.task && l.takeaway && l.steps.length >= 3, t.id);
      l.steps.forEach(s => assert(s.length === 2 && s[0] && s[1], t.id));
    }));
    test('У каждого вопроса банка есть пошаговое решение', () => T.QUESTIONS.forEach(q => assert((T.SOLUTIONS[q.id] || []).length >= 1, q.id)));
    test('Нет решений для несуществующих вопросов', () => Object.keys(T.SOLUTIONS).forEach(id => assert(T.QUESTION[id], id)));
    test('Каждое решение приходит к верному ответу (текст ответа есть в решении)', () => {
      const bad = T.QUESTIONS.filter(q => !norm(T.SOLUTIONS[q.id].join(' | ')).includes(norm(q.options.find(o => o.ok).t))).map(q => q.id);
      eq(bad, []);
    });

    /* ---------- Генераторы ---------- */
    const value = s => { // «3/4» → 0.75, «−5» → −5, «≈2,67» → 2.67; для буквенных ответов — null
      const m = /^≈?(−?\d+(?:,\d+)?)(?:\/(\d+))?$/.exec(s);
      if (!m) return null;
      const n = Number(m[1].replace('−', '-').replace(',', '.'));
      return m[2] ? n / Number(m[2]) : n;
    };
    Object.keys(T.GENERATORS).forEach(topic => {
      test(`Генератор «${T.TOPIC[topic].title}»: 500 задач — 4 разных варианта, один верный, метки ошибок существуют`, () => {
        const rand = T.rng(42);
        for (let i = 0; i < 500; i++) {
          const q = T.GENERATORS[topic](rand);
          eq(q.topic, topic);
          eq(q.options.length, 4, q.text + ': ');
          eq(q.options.filter(o => o.ok).length, 1, q.text + ': ');
          eq(new Set(q.options.map(o => o.t)).size, 4, q.text + ': ');
          assert(q.sol.length >= 2, q.text + ': нет решения');
          q.options.forEach(o => { if (o.mis) assert(T.MISCONCEPTIONS[o.mis], o.mis); });
          const right = value(q.options.find(o => o.ok).t);
          if (right !== null) q.options.filter(o => !o.ok).forEach(o => {
            const v = value(o.t);
            assert(v === null || Math.abs(v - right) > 1e-9, `${q.text}: неверный вариант «${o.t}» равен верному`);
          });
        }
      });
    });
    test('Генераторы считают верно (независимая проверка арифметики)', () => {
      const rand = T.rng(7);
      for (let i = 0; i < 300; i++) {
        let q = T.GENERATORS.lin(rand), m = /^(\d+)x \+ (\d+) = (\d+)/.exec(q.text);
        eq(value(q.options.find(o => o.ok).t), (m[3] - m[2]) / m[1], q.text + ': ');
        q = T.GENERATORS.pct(rand);
        const pp = Number(/(\d+)%/.exec(q.text)[1]), aa = Number(q.text.replace(/\d+%/, '').match(/\d+/)[0]);
        eq(value(q.options.find(o => o.ok).t), aa * pp / 100, q.text + ': ');
        q = T.GENERATORS.frac(rand);
        const ans = value(q.options.find(o => o.ok).t);
        if ((m = /^1\/(\d+) \+ 1\/(\d+)/.exec(q.text))) assert(Math.abs(ans - (1 / m[1] + 1 / m[2])) < 1e-9, q.text);
        else { m = /^(\d+)\/(\d+) : (\d+)\/(\d+)/.exec(q.text); assert(Math.abs(ans - (m[1] / m[2]) / (m[3] / m[4])) < 1e-9, q.text); }
        q = T.GENERATORS.neg(rand);
        const expr = q.text.replace(' = ?', '').replace(/−/g, '-').replace(/·/g, '*').replace(/- \(-(\d+)\)/, '+ $1');
        eq(value(q.options.find(o => o.ok).t), Function('return ' + expr)(), q.text + ': ');
        q = T.GENERATORS.arith(rand);
        eq(value(q.options.find(o => o.ok).t), Function('return ' + q.text.replace(' = ?', '').replace(/·/g, '*').replace(/:/g, '/'))(), q.text + ': ');
      }
    });
    test('nextQuestion: сначала невиданные из банка, без генератора — не повторяет последний', () => {
      const seen = [];
      for (let i = 0; i < 6; i++) { const q = T.nextQuestion('quad', seen, T.rng(i)); assert(!seen.includes(q.id), 'повтор'); seen.push(q.id); }
      for (let i = 0; i < 20; i++) assert(T.nextQuestion('quad', seen, T.rng(i)).id !== seen[5], 'повтор последнего');
      assert(T.nextQuestion('frac', T.questionsByTopic.frac.map(q => q.id), T.rng(1)).gen, 'банк исчерпан — должен включиться генератор');
    });

    /* ---------- Модель ученика ---------- */
    function seeded() { // ученик с единственным настоящим корнем — дроби
      const rand = T.rng(11), d = new T.Diagnostic(T.GOALS[0].start, { rand });
      const s = T.simulateStudent(['frac'], rand, { known: 1, unknown: 0, misRate: 1 });
      let cur; while ((cur = d.next())) d.answer(s.pick(cur));
      L.reset(); L.fromDiagnostic('Тест', d.result());
    }
    const q0 = id => T.questionsByTopic[id][0];
    function master(id) { for (let i = 0; i < L.NEED; i++) L.practiceAnswer(id, true, true); }

    test('Диагностика → модель: корень — дроби, первый шаг плана — урок по дробям', () => {
      seeded();
      eq(L.roots(), ['frac']);
      eq(L.topic('frac').st, 'gap');
      const t = L.today()[0];
      eq([t.kind, t.topic], ['lesson', 'frac']);
      assert(L.locked('pct') && !L.locked('frac'), 'темы над корнем должны быть закрыты');
    });
    test('Урок переводит тему в «изучаю», план предлагает практику', () => {
      seeded(); L.completeLesson('frac');
      eq(L.topic('frac').st, 'learning');
      eq(L.today()[0].kind, 'practice');
    });
    test('Освоение: нужно 3 верных подряд; ошибка сбрасывает серию; ответ с подсказкой не считается', () => {
      seeded(); L.completeLesson('frac');
      assert(!L.practiceAnswer('frac', true, true)); assert(!L.practiceAnswer('frac', true, true));
      assert(!L.practiceAnswer('frac', false, true), 'ошибка');
      eq(L.topic('frac').streak, 0);
      assert(!L.practiceAnswer('frac', true, true)); assert(!L.practiceAnswer('frac', true, false), 'с подсказкой');
      eq(L.topic('frac').streak, 1);
      assert(!L.practiceAnswer('frac', true, true)); assert(L.practiceAnswer('frac', true, true), 'третий подряд');
      eq(L.topic('frac').st, 'mastered');
    });
    test('После освоения корня открывается следующая тема пути', () => {
      seeded(); L.completeLesson('frac'); master('frac');
      assert(!L.roots().includes('frac'));
      assert(L.roots().length > 0 && L.roots().every(id => !L.locked(id)), 'новые корни');
    });
    test('Интервальные повторения: 1 день → 3 → 9 (закреплено); провал возвращает в работу', () => {
      seeded(); L.completeLesson('frac'); master('frac');
      assert(!L.isDue('frac'), 'сегодня повторять рано');
      L.advance(1); assert(L.isDue('frac'), 'через день — пора');
      eq(L.today()[0].topic, 'frac'); eq(L.today()[0].kind, 'check');
      assert(L.checkResult('frac', 2)); eq(L.topic('frac').ivl, 3); assert(!L.isDue('frac'));
      L.advance(3); assert(L.isDue('frac'));
      assert(L.checkResult('frac', 2)); eq(L.topic('frac').ivl, 9); eq(L.topic('frac').st, 'solid');
      L.advance(9); assert(!L.checkResult('frac', 1)); eq(L.topic('frac').st, 'learning');
      assert(L.roots().includes('frac'), 'забытая тема снова в плане');
    });
    test('Ошибка «чужой» темы ставит ту тему на проверку сегодня', () => {
      seeded();
      eq(L.topic('neg').st === 'gap' || L.topic('neg').st === 'learning', false);
      const flagged = L.recordAnswer('expr', q0('expr'), { t: 'x', mis: 'neg_mult_sign' });
      eq(flagged, 'neg'); assert(L.isDue('neg'));
      eq(L.recordAnswer('frac', q0('frac'), { t: 'x', mis: 'frac_add_across' }), null, 'своя ошибка: ');
    });
    test('Без диагностики: план начинает с проверки базовой темы; провал превращает её в пробел', () => {
      L.reset(); L.startBlank('Тест');
      const t = L.today()[0];
      eq([t.kind, T.TOPIC[t.topic].level], ['check', 0]);
      assert(!L.checkResult(t.topic, 0)); eq(L.topic(t.topic).st, 'gap');
      eq(L.today()[0].kind, 'lesson');
    });
    test('Пробел над непроверенной основой: сначала проверяем основу, потом урок', () => {
      L.reset(); L.startBlank('Тест');
      L.checkResult('fsu', 0); // как после остановленной диагностики: пробел есть, основа (степени, выражения) не проверена
      let t = L.today()[0];
      eq([t.kind, t.topic, t.base], ['check', 'pow', 'fsu']);
      L.checkResult('pow', 2); t = L.today()[0];
      eq([t.kind, t.topic], ['check', 'expr']);
      L.checkResult('expr', 0); // корень оказался глубже
      assert(L.roots().includes('expr') && !L.roots().includes('fsu'), 'корень должен сместиться вниз');
    });
    test('Проверка засчитанной темы подтверждает её', () => {
      seeded();
      const inf = T.TOPICS.find(x => L.topic(x.id).st === 'inferred');
      assert(inf, 'в демо должна быть засчитанная тема');
      assert(L.checkResult(inf.id, 2)); eq(L.topic(inf.id).st, 'mastered');
    });
    test('Готовность растёт по мере освоения; серия дней считается', () => {
      seeded(); const before = L.readiness();
      L.completeLesson('frac'); master('frac');
      assert(L.readiness() > before, 'готовность');
      eq(L.streakDays(), 1); L.advance(1); L.completeLesson('pct'); eq(L.streakDays(), 2);
      L.advance(3); eq(L.streakDays(), 0, 'пропуск обнуляет серию: ');
    });
    test('Повреждённые сохранённые данные не ломают модель', () => {
      assert(!L._load({ v: 2 })); assert(!L.exists());
      assert(L._load({ v: 1, name: 'X', topics: { frac: { st: 'hacked', seen: ['nope'], due: 'x' }, ghost: { st: 'gap' } }, mis: { nope: 3 } }));
      eq(L.topic('frac').st, 'unknown'); eq(L.topic('frac').seen, []); eq(Object.keys(L.get().mis), []);
    });

    test('Все скрипты приложения разбираются без синтаксических ошибок', () => {
      ['data', 'data-ent', 'i18n', 'engine', 'content', 'content-ent', 'kk-ent', 'kk', 'learner', 'graph', 'store', 'config', 'account', 'app', 'teacher'].forEach(name => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'js/' + name + '.js?t=' + Date.now(), false); xhr.send();
        assert(xhr.status === 200, 'нет файла ' + name);
        try { new Function(xhr.responseText); } catch (e) { throw new Error(name + '.js: ' + e.message); }
      });
    });

    /* ---------- Аккаунт и синхронизация ---------- */
    const A = T.account;
    test('Аккаунты выключены, пока в config.js нет адреса и ключа, — приложение работает как раньше', () => {
      eq(A.enabled, false); eq(A.user(), null);
      eq(T.learner.onSave, null, 'без облака сохранения никуда не уходят: ');
    });
    test('Сверка с облаком: кто новее, тот и остаётся; чужой прогресс молча не затирается', () => {
      const d = A._decide, st = (owner, updated) => ({ owner, updated });
      eq(d(null, null, 'u1'), 'none');
      eq(d(st(null, 5), null, 'u1'), 'push', 'гость завёл аккаунт — его прогресс уходит в облако: ');
      eq(d(null, { state: st('u1', 5) }, 'u1'), 'pull', 'новое устройство: ');
      eq(d(st('u1', 9), { state: st('u1', 5) }, 'u1'), 'push', 'на устройстве новее: ');
      eq(d(st('u1', 5), { state: st('u1', 9) }, 'u1'), 'pull', 'в облаке новее: ');
      eq(d(st('u1', 5), { state: st('u1', 5) }, 'u1'), 'none');
      eq(d(st(null, 99), { state: st('u1', 1) }, 'u1'), 'ask', 'гостевой прогресс против аккаунта: ');
      eq(d(st('u2', 99), { state: st('u1', 1) }, 'u1'), 'ask', 'прогресс другого аккаунта: ');
    });
    test('Прогресс помнит владельца: новая диагностика его не теряет, выход — стирает', () => {
      L.reset(); L.forget(); L.startBlank('Тест');
      eq(L.get().owner, null);
      const before = L.get().updated;
      L.setOwner('u1');
      eq(L.get().owner, 'u1'); eq(L.get().updated, before, 'привязка к аккаунту не считается изменением прогресса: ');
      seeded(); eq(L.get().owner, 'u1', 'после новой диагностики: ');
      L.reset(); L.startBlank('Тест'); eq(L.get().owner, 'u1', 'после сброса прогресса: ');
      L.forget(); eq(L.exists(), false); L.startBlank('Гость'); eq(L.get().owner, null, 'после выхода: ');
    });
    test('Каждое сохранение ставит время изменения и сообщает об этом синхронизации', () => {
      L.reset(); L.forget(); L.startBlank('Тест');
      let calls = 0; L.onSave = () => { calls++; };
      const t0 = L.get().updated; assert(t0 > 0, 'время изменения');
      L.completeLesson('arith');
      assert(calls === 1 && L.get().updated >= t0, 'сохранение не дошло до синхронизации');
      L.setOwner('u1'); eq(calls, 1, 'привязка к аккаунту не должна вызывать отправку: ');
      L.onSave = null;
    });
    test('Прогресс из облака проходит ту же проверку, что и локальный', () => {
      L.reset(); L.forget();
      assert(!L.adopt({ v: 2 }, 'u1'), 'мусор из облака не принимается'); eq(L.exists(), false);
      assert(L.adopt({ v: 1, name: 'Из облака', updated: 7, topics: { frac: { st: 'mastered' }, ghost: { st: 'gap' } } }, 'u1'));
      eq([L.get().name, L.get().owner, L.get().updated, L.topic('frac').st], ['Из облака', 'u1', 7, 'mastered']);
      L.forget();
    });
    test('Сессия собирается из токена: id, почта и имя берутся из JWT', () => {
      const b64 = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const jwt = b64({ alg: 'none' }) + '.' + b64({ sub: 'user-1', email: 'a@b.kz', user_metadata: { name: 'Әлия' } }) + '.x';
      const s = A._fromTokens({ access_token: jwt, refresh_token: 'r', expires_in: 3600 });
      eq(s.user, { id: 'user-1', email: 'a@b.kz', name: 'Әлия' });
      assert(s.expires_at > Date.now() + 3500000, 'срок действия');
      eq(A._fromTokens({ access_token: 'не токен' }), null);
      eq(A._fromTokens(null), null);
    });
    test('Ошибки сервера превращаются в понятные причины', () => {
      const k = A._kindOf;
      eq(k(400, { error_code: 'invalid_credentials', msg: 'Invalid login credentials' }), 'credentials');
      eq(k(400, { error: 'invalid_grant', error_description: 'Invalid login credentials' }), 'credentials', 'старый формат: ');
      eq(k(422, { error_code: 'user_already_exists' }), 'exists');
      eq(k(400, { code: 400, msg: 'User already registered' }), 'exists');
      eq(k(422, { error_code: 'weak_password' }), 'weak');
      eq(k(400, { error_code: 'email_not_confirmed' }), 'unconfirmed');
      eq(k(429, { error_code: 'over_email_send_rate_limit', msg: 'email rate limit exceeded' }), 'mailrate', 'лимит писем: ');
      eq(k(429, {}), 'rate'); eq(k(401, null), 'auth'); eq(k(500, null), 'server');
    });

    /* ---------- Казахский перевод ---------- */
    const CYR = /[А-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]/;
    const KK = T.KK, has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    test('Перевод: есть казахский текст для каждой темы, ошибки мышления, цели, урока и решения', () => {
      T.TOPICS.forEach(x => assert(has(KK.topics, x.id) && KK.topics[x.id].length >= 3, 'тема ' + x.id));
      Object.keys(T.MISCONCEPTIONS).forEach(id => assert(has(KK.mis, id) && KK.mis[id].length === 2, 'ошибка ' + id));
      T.GOALS.forEach(g => assert(has(KK.goals, g.id), 'цель ' + g.id));
      T.TOPICS.forEach(x => {
        const l = KK.lessons[x.id];
        assert(l && l.task && l.takeaway && l.steps.length >= 3, 'урок ' + x.id);
      });
      T.QUESTIONS.forEach(q => assert(has(KK.sol, q.id) && KK.sol[q.id].length >= 1, 'решение ' + q.id));
      [KK.topics, KK.mis, KK.goals, KK.lessons].forEach((o, i) => Object.keys(o).forEach(id =>
        assert([T.TOPIC, T.MISCONCEPTIONS, Object.fromEntries(T.GOALS.map(g => [g.id, 1])), T.TOPIC][i][id], 'лишний перевод ' + id)));
      Object.keys(KK.sol).concat(Object.keys(KK.q)).forEach(id => assert(T.QUESTION[id], 'перевод для несуществующего вопроса ' + id));
    });
    test('Перевод: у казахского урока столько же шагов, сколько у русского, и те же числа в решениях', () => {
      if (T.lang === 'kk') return; // сравнивать можно только с русским оригиналом
      const nums = a => a.join(' ').replace(/[^0-9]/g, '').split('').sort().join(''); // порядок слов в языках разный
      T.TOPICS.forEach(x => eq(KK.lessons[x.id].steps.length, T.LESSONS[x.id].steps.length, 'урок ' + x.id + ': '));
      T.QUESTIONS.forEach(q => eq(KK.sol[q.id].length, T.SOLUTIONS[q.id].length, 'решение ' + q.id + ': '));
      const bad = T.QUESTIONS.filter(q => nums(KK.sol[q.id]) !== nums(T.SOLUTIONS[q.id])).map(q => q.id);
      eq(bad, [], 'числа в решениях расходятся: ');
    });
    if (T.lang === 'kk') {
      test('Қазақша: каждый вопрос и вариант со словами переведён', () => {
        const q = T.QUESTIONS.filter(x => CYR.test(x.ru) && x.text === x.ru).map(x => x.id);
        eq(q, [], 'вопросы без перевода: ');
        const units = /^[^А-Яа-яЁё]*\s?(км|кг|см|см²|см³)$/; // единицы измерения пишутся одинаково
        const o = [];
        T.QUESTIONS.forEach(x => x.options.forEach(y => { if (CYR.test(y.ru) && y.t === y.ru && !units.test(y.ru)) o.push(x.id + ': ' + y.ru); }));
        eq(o, [], 'варианты без перевода: ');
      });
      test('Қазақша: в переведённых вопросах сохранились все числа и формулы', () => {
        const sig = s => s.replace(/[А-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі\s.,:?—«»()\-]/g, '').split('').sort().join('');
        const loose = new Set(Object.keys(KK.q)); // переведены целиком: порядок слов другой, сверяем только цифры
        const digits = s => s.replace(/[^0-9]/g, '').split('').sort().join('');
        const bad = T.QUESTIONS.filter(x => (loose.has(x.id) ? digits(x.text) !== digits(x.ru) : sig(x.text) !== sig(x.ru))).map(x => x.id);
        eq(bad, []);
      });
    }
    test('Перевод интерфейса: каждая строка t(…) из app.js, graph.js и teacher.js есть в словаре', () => {
      const missing = [];
      ['js/app.js', 'js/graph.js', 'js/teacher.js'].forEach(file => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', file + '?t=' + Date.now(), false); xhr.send();
        assert(xhr.status === 200, 'не удалось прочитать ' + file);
        const re = /\bt\('((?:[^'\\]|\\.)*)'/g; let m;
        while ((m = re.exec(xhr.responseText))) if (!has(T.UI_KK, m[1])) missing.push(m[1]);
      });
      eq([...new Set(missing)], []);
    });
    test('Перевод интерфейса: в словаре нет строк, которых нет в коде, и подстановки не потеряны', () => {
      let src = '';
      ['js/app.js', 'js/graph.js', 'js/teacher.js'].forEach(file => {
        const xhr = new XMLHttpRequest(); xhr.open('GET', file + '?t=' + Date.now(), false); xhr.send(); src += xhr.responseText;
      });
      const unused = Object.keys(KK.ui).filter(k => !src.includes("'" + k + "'"));
      eq(unused, [], 'лишние строки: ');
      const optional = new Set(['hold', 'themes', 'checked', 'rw', 'days', 'd']); // русское склонение, казахскому шаблону не нужно
      const lost = [];
      Object.entries(KK.ui).forEach(([ru, kk]) => (ru.match(/\{\w+\}/g) || []).forEach(p => {
        if (!kk.includes(p) && !optional.has(p.slice(1, -1))) lost.push(ru + ' → ' + p);
      }));
      eq(lost, [], 'потеряны подстановки: ');
      const extra = [];
      Object.entries(KK.ui).forEach(([ru, kk]) => (kk.match(/\{\w+\}/g) || []).forEach(p => { if (!ru.includes(p)) extra.push(ru + ' → ' + p); }));
      eq(extra, [], 'лишние подстановки: ');
    });

    L.reset();
    const failed = results.filter(r => !r.ok).length;
    document.getElementById('summary').textContent = `${results.length - failed} из ${results.length} пройдено` + (failed ? ` · провалено: ${failed}` : '');
    document.title = (failed ? '✗ ' : '✓ ') + document.title;
  </script>
</body>
